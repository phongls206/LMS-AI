version: '3.8'

services:
  # ==========================================
  # DỊCH VỤ 1: CSDL POSTGRESQL 15 ALPINE
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: etc_english_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-etc_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-etc_password_secure_2026}
      POSTGRES_DB: ${DB_NAME:-etc_english}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-etc_user} -d ${DB_NAME:-etc_english}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - etc_network

  # ==========================================
  # DỊCH VỤ 2: BACKEND API SERVICE (NESTJS)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: etc_english_backend
    restart: unless-stopped
    ports:
      - '${PORT:-8000}:8000'
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgresql://${DB_USER:-etc_user}:${DB_PASSWORD:-etc_password_secure_2026}@postgres:5432/${DB_NAME:-etc_english}?schema=public
      JWT_SECRET: ${JWT_SECRET:-etc_english_super_jwt_secret_2026}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-etc_refresh_secret_key_2026}
      REFRESH_TOKEN_EXPIRATION: ${REFRESH_TOKEN_EXPIRATION:-7d}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - etc_network

  # ==========================================
  # DỊCH VỤ 3: FRONTEND WEB APP (NEXT.JS)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: etc_english_frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    networks:
      - etc_network

# ==========================================
# KHỞI TẠO MẠNG NỘI BỘ VÀ VOLUME LƯU TRỮ
# ==========================================
networks:
  etc_network:
    name: etc_english_network
    driver: bridge

volumes:
  postgres_data:
    name: etc_english_postgres_data
