version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: etc_english_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-etc_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-etc_password}
      POSTGRES_DB: ${DB_NAME:-etc_english}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-etc_user} -d ${DB_NAME:-etc_english}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: etc_english_postgres_data
